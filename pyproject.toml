[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geecomposer"
version = "0.1.0"
description = "Lightweight Earth Engine compositing for Sentinel-1 and Sentinel-2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4.6",
  "earthengine-api>=1.7.43",
  "geopandas>=1.1.4",
  "shapely>=2.1.2",
  "google-auth>=2.57.1",
  "google-cloud-storage>=3.14.1",
]

[project.scripts]
geecomposer = "geecomposer.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.exclude-package-data]
geecomposer = ["*.json"]

[project.optional-dependencies]
dev = [
  "build>=1.6.0",
  "setuptools>=68",
  "wheel",
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
